name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify question banks
        run: npm run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: End-to-end production smoke verification
        run: npm run verify:e2e


      - name: Synchronize legacy Pages source with verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "legacy"')"
          echo "GitHub Pages build_type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "legacy" ]; then
            cp -a dist/. .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Branch publishing files are already synchronized."
            else
              git commit -m "chore: sync production Pages output"
              git push origin HEAD:main
            fi
            echo "Requesting an explicit GitHub Pages rebuild from the synchronized branch..."
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
            for attempt in {1..60}; do
              STATUS="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status // empty' 2>/dev/null || true)"
              echo "Pages build status: ${STATUS:-unknown}"
              if [ "$STATUS" = "built" ]; then
                break
              fi
              if [ "$STATUS" = "errored" ]; then
                echo "GitHub Pages build reported an error."
                exit 1
              fi
              sleep 5
            done
          else
            echo "Pages is configured for workflow publishing; no legacy branch sync is required."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for competing automatic Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | [.status,.conclusion,.id] | @tsv' 2>/dev/null | head -n 1 || true)"
            if [ -z "$run_json" ]; then
              echo "No automatic Pages/Jekyll run found for this commit; continuing."
              break
            fi
            status="$(printf '%s' "$run_json" | cut -f1)"
            conclusion="$(printf '%s' "$run_json" | cut -f2)"
            run_id="$(printf '%s' "$run_json" | cut -f3)"
            echo "Automatic Pages run $run_id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  smoke:
    name: Live production smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed production routes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          node scripts/verifyPhase10E2E.mjs --remote "$PAGE_URL"
