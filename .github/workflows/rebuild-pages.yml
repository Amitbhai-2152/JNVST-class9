name: Production Build Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production verification audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify question banks and release contracts
        run: npm run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: End-to-end production smoke verification
        run: npm run verify:e2e
