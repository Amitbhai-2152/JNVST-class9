name: Rebuild and Publish Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify
        run: npm run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Publish production files to repository root
        run: |
          rm -rf assets
          cp -R dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          if git diff --cached --quiet; then
            echo "Production files already up to date"
          else
            git commit -m "chore: publish current production build"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
